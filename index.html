<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173f4d"><title>Minha Rotina | Agenda do Dia</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:light dark;--bg:#f3f6f7;--surface:#fff;--text:#17313b;--muted:#60757d;--line:#dbe5e8;--accent:#176b76;--soft:#e4f2f1;--danger:#b73535}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{display:flex;min-height:100vh}.sidebar{width:230px;background:var(--surface);border-right:1px solid var(--line);padding:24px 15px;flex-shrink:0}.brand{font-size:21px;font-weight:800;letter-spacing:-.7px;margin:0 0 30px 10px}.brand span{color:var(--accent)}.nav{display:grid;gap:8px}.nav button{background:transparent;border:0;text-align:left;padding:13px;border-radius:12px;color:var(--text)}.nav button.active{background:var(--soft);color:var(--accent);font-weight:700}.main{width:100%;max-width:1180px;margin:auto;padding:32px 34px 110px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;color:var(--accent);font-weight:800}h1{font-size:clamp(26px,3vw,35px);margin:5px 0}h2{font-size:19px;margin:0 0 14px}.muted{color:var(--muted)}.btn{border:0;background:var(--accent);color:white;border-radius:10px;padding:11px 16px;font-weight:700}.btn.secondary{background:var(--soft);color:var(--accent)}.btn.danger{background:#fbe7e7;color:var(--danger)}.btn.tiny{padding:7px 10px;font-size:13px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat strong{display:block;font-size:28px;margin-top:6px}.notice{border-left:4px solid #d99b2b;background:#fff8e8;color:#6c4a0a}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:7px}.item{border-top:1px solid var(--line);padding:15px 0;display:flex;justify-content:space-between;align-items:center;gap:15px}.item:first-child{border-top:0}.item-title{font-weight:700}.tag{display:inline-block;border-radius:100px;background:var(--soft);color:var(--accent);font-size:12px;padding:4px 9px;margin:4px 6px 0 0}.tag.gray{background:var(--bg);color:var(--muted)}.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}input,select,textarea{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:11px;border-radius:9px;min-width:0}input[type=date]{max-width:190px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.formgrid label{display:grid;gap:6px;font-size:13px;font-weight:700}.formgrid label.full{grid-column:1/-1}.checkdays{display:flex;flex-wrap:wrap;gap:12px}.checkdays label{display:flex;align-items:center;gap:5px;font-size:13px}.checkdays input{width:auto}.hide{display:none!important}.bottom{display:none}.empty{padding:28px;text-align:center;color:var(--muted)}.proposal{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.proposal strong{display:block}.proposal .muted{font-size:13px;margin:6px 0}.search-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.search-grid label{display:grid;gap:5px;font-size:13px;font-weight:700}.search-grid input{width:100%;max-width:none}.search-results{max-height:none}.search-result-date{font-size:13px;color:var(--muted);margin-top:4px}@media(max-width:760px){.search-grid{grid-template-columns:1fr}}.foot{font-size:12px;color:var(--muted);margin-top:20px}@media(prefers-color-scheme:dark){:root{--bg:#101d23;--surface:#192a32;--text:#e8f0f2;--muted:#a2b7bf;--line:#334952;--accent:#76d2d0;--soft:#25464c;--danger:#ff9e9e}.notice{background:#42371d;color:#ffdc9c}.btn.danger{background:#4d292b}}@media(max-width:760px){.sidebar{display:none}.main{padding:23px 15px 105px}.head{align-items:flex-start}.stats{gap:7px}.panel{padding:15px}.stat strong{font-size:23px}.item{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:9px 4px max(10px,env(safe-area-inset-bottom))}.bottom button{background:transparent;border:0;color:var(--muted);padding:7px;font-size:12px}.bottom button.active{color:var(--accent);font-weight:800}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">Minha <span>Rotina</span></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="head"><div><div class="eyebrow">Gerenciador de Rotina Web</div><h1 id="pageTitle">Agenda do Dia</h1><div class="muted" id="subtitle">Sua rotina, com clareza.</div></div><button class="btn" id="newBtn">+ Atividade</button></div><div id="content"></div><p class="foot">Dados armazenados apenas neste navegador e dispositivo. Não há sincronização automática. Primeira entrega: cadastro e agenda.</p></main></div><nav class="bottom" id="bottom"></nav>
<dialog id="dialog" style="border:1px solid var(--line);border-radius:18px;max-width:620px;width:calc(100% - 25px);background:var(--surface);color:var(--text)"><h2 id="formTitle">Nova atividade</h2><form id="activityForm"><div class="formgrid"><label class="full">Atividade<input id="fName" required maxlength="140"></label><label>Categoria<select id="fCategory"><option>Espiritualidade</option><option>Saúde</option><option>Família</option><option>Trabalho</option><option>Amigos</option></select></label><label>Tipo<select id="fType"><option>Fixa</option><option>Variável</option></select></label><label>Duração (minutos)<input id="fDuration" type="number" min="1" max="1440" required></label><label>Horário (opcional)<input id="fTime" type="time"></label><label>Frequência<select id="fFrequency"><option>Semanal</option><option>Diária</option><option>Quinzenal</option><option>Mensal</option><option>Bimestral</option><option>Trimestral</option><option>Semestral</option><option>Anual</option><option>Única</option></select></label><label>Data de referência<input id="fStart" type="date"></label><label class="full">Dias da semana<div class="checkdays" id="daychecks"></div></label><label class="full">Observações<textarea id="fNotes" rows="2"></textarea></label></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn secondary" id="cancelForm">Cancelar</button><button class="btn" type="submit">Salvar atividade</button></div></form></dialog>
<script>
'use strict';const KEY='minha_rotina_v1';const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const INITIAL=[
['Espiritualidade','Ir à missa','Fixa',[5],90,'17:00','Semanal'],['Espiritualidade','Leitura de algo bíblico','Fixa',[0,1,2,3,4,5,6],15,'','Diária'],['Saúde','Karatê','Fixa',[1,3,5],120,'19:00','Semanal'],['Saúde','Musculação','Fixa',[2,4,6],15,'','Semanal'],['Saúde','Corrida','Fixa',[0,6],90,'07:00','Semanal'],['Família','Brincar','Fixa',[0,2,4,6],30,'','Semanal'],['Família','Lavar quintal','Variável',[],180,'','Quinzenal'],['Família','Levar e buscar o Otávio na missa','Fixa',[6],30,'','Semanal'],['Família','Buscar o Otávio na Natação','Fixa',[4],30,'18:15','Semanal'],['Família','Impermeabilização da laje','Variável',[],240,'','Anual'],['Espiritualidade','Doar sangue','Variável',[],120,'','Trimestral'],['Espiritualidade','Fazer doação Goas','Variável',[],15,'','Mensal'],['Família',"Lavar caixa d'água",'Variável',[],120,'','Semestral'],['Família','Cortar grama','Variável',[],180,'','Quinzenal'],['Trabalho','Lavar o carro','Variável',[],180,'','Quinzenal'],['Trabalho','Trabalho nos clientes','Fixa',[1,2,3,4,5],60,'','Semanal'],['Trabalho','Trabalho ESA','Fixa',[1,2,3,4,5],120,'','Semanal'],['Trabalho','Trabalho Fractal QMS','Fixa',[1,2,3,4,5],30,'','Semanal'],['Família','Passar na casa da mãe','Fixa',[0,2,6],15,'','Semanal'],['Amigos','Marcar com os amigos','Variável',[],60,'','Bimestral']];
const seed=()=>({version:1,activated:false,start:'2026-11-01',activities:INITIAL.map((a,i)=>({id:'base-'+(i+1),category:a[0],name:a[1],type:a[2],days:a[3],duration:a[4],time:a[5],frequency:a[6],start:'2026-11-01',notes:'',validated:false})),done:{}});let state;try{const stored=JSON.parse(localStorage.getItem(KEY));state=stored&&Array.isArray(stored.activities)?stored:seed()}catch{state=seed()}state.scheduled=Array.isArray(state.scheduled)?state.scheduled:[];let view='today',date=new Date().toLocaleDateString('en-CA'),editing=null;let rangeStart='2027-01-01',rangeEnd='2027-01-31',searchTerm='';const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),duration=n=>Math.floor(n/60)?`${Math.floor(n/60)}h${n%60?String(n%60).padStart(2,'0'):''}`:`${n} min`,weekday=s=>new Date(s+'T12:00:00').getDay(),todayItems=()=>state.activities.filter(a=>a.type==='Fixa'&&a.days.includes(weekday(date))&&date>=a.start).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')),doneKey=a=>date+'|'+a.id;

 const priority=['Espiritualidade','Saúde','Família','Trabalho','Amigos'];
 const localISO=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
 const shift=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return localISO(d)};
 const fixedOn=ds=>state.activities.filter(a=>a.type==='Fixa'&&ds>=a.start&&a.days.includes(weekday(ds)));
 const bookedOn=ds=>state.scheduled.filter(b=>b.date===ds);
 const capacity=ds=>{const base=weekday(ds)===0||weekday(ds)===6?870:690;const fixed=fixedOn(ds).reduce((t,a)=>t+Number(a.duration),0);return {fixed,free:Math.max(0,base-fixed),limit:Math.max(0,Math.floor((base-fixed)*.8)),booked:bookedOn(ds).reduce((t,b)=>t+Number(b.duration),0)}};
 const intervals={Quinzenal:14,Mensal:30,Bimestral:60,Trimestral:91,Semestral:182,Anual:365,Semanal:7,Diária:1};
 function suggestions(){const start=date<'2026-11-01'?'2026-11-01':date;const dates=Array.from({length:28},(_,i)=>shift(start,i));const simulated=new Map(dates.map(d=>[d,capacity(d).booked]));const result=[];
 for(const a of [...state.activities].filter(x=>x.type==='Variável').sort((x,y)=>priority.indexOf(x.category)-priority.indexOf(y.category))){
 const previous=state.scheduled.filter(x=>x.activityId===a.id).sort((x,y)=>y.date.localeCompare(x.date))[0];const anchor=previous?.date||a.start||'2026-11-01';const interval=intervals[a.frequency]||0;
 const earliest=previous&&interval?shift(anchor,interval):anchor;const candidate=dates.find(d=>d>=earliest&&d>=a.start&&(a.name!=='Doar sangue'||new Date(d+'T12:00:00').getDay()===6)&&simulated.get(d)+Number(a.duration)<=capacity(d).limit);
 if(candidate){result.push({activity:a,date:candidate});simulated.set(candidate,simulated.get(candidate)+Number(a.duration))}else result.push({activity:a,date:null});
 }return result}
 function scheduledCards(ds){return bookedOn(ds).map(b=>{const a=state.activities.find(x=>x.id===b.activityId);if(!a)return '';const done=!!state.done[ds+'|'+a.id];return `<div class="item"><div><div class="item-title">${esc(a.name)}</div><span class="tag">${esc(a.category)}</span><span class="tag gray">Variável · ${duration(b.duration)}</span>${done?'<span class="tag">Concluída</span>':''}</div><div class="actions"><button class="btn tiny ${done?'secondary':''}" data-done="${esc(a.id)}">${done?'Desfazer':'Concluir'}</button><button class="btn tiny secondary" data-unbook="${esc(b.id)}">Cancelar agendamento</button></div></div>`}).join('')}
function nav(){const links=[['today','◷','Hoje'],['week','▦','Semana'],['activities','☷','Atividades'],['pending','◉','Pendências'],['settings','⚙','Configurações']];for(const target of ['nav','bottom'])$(target).innerHTML=links.map(([v,i,n])=>`<button class="${view===v?'active':''}" data-view="${v}">${i} ${n}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}
function card(a,options={}){const done=!!state.done[doneKey(a)];return `<div class="item"><div><div class="item-title">${esc(a.name)}</div><span class="tag">${esc(a.category)}</span><span class="tag gray">${duration(a.duration)} · ${a.time||'Horário a definir'}</span>${options.showFrequency?`<span class="tag gray">${esc(a.frequency)}</span>`:''}${done?'<span class="tag">Concluída</span>':''}</div><div class="actions">${options.track?`<button class="btn tiny ${done?'secondary':''}" data-done="${esc(a.id)}" ${!state.activated?'disabled title="Ative a rotina após validar as atividades"':''}>${done?'Desfazer':'Concluir'}</button>`:''}<button class="btn tiny secondary" data-edit="${esc(a.id)}">Editar</button></div></div>`}
function render(){nav();const titles={today:'Agenda do Dia',week:'Agenda semanal',activities:'Cadastro de atividades',pending:'Pendências',settings:'Configurações'};$('pageTitle').textContent=titles[view];$('newBtn').style.display=view==='settings'?'none':'';const fixed=state.activities.filter(a=>a.type==='Fixa').length;const variable=state.activities.length-fixed;let html='';if(view==='today'){const items=todayItems(),minutes=items.reduce((n,a)=>n+a.duration,0),booked=bookedOn(date);html=`<div class="stats"><div class="panel stat"><span class="muted">Atividades</span><strong>${items.length+booked.length}</strong></div><div class="panel stat"><span class="muted">Horas fixas</span><strong>${duration(minutes)}</strong></div><div class="panel stat"><span class="muted">Concluídas</span><strong>${[...items,...booked.map(b=>state.activities.find(a=>a.id===b.activityId)).filter(Boolean)].filter(a=>state.done[doneKey(a)]).length}</strong></div></div>${!state.activated?'<div class="panel notice"><strong>Programação ainda não ativada.</strong><p>Confira as atividades em Cadastro e aprove a ativação em Configurações. A agenda é apenas uma prévia.</p></div>':''}<section class="panel"><div class="row"><h2>Compromissos do dia</h2><input aria-label="Selecionar dia" type="date" id="dayPicker" value="${date}"></div>${items.length||booked.length?items.map(a=>card(a,{track:true})).join('')+scheduledCards(date):'<div class="empty">Nenhuma atividade cadastrada para esta data.</div>'}</section><div class="panel"><strong>Avaliação de capacidade</strong><p class="muted">Disponibilidade após necessidades, deslocamento e compromissos fixos: ${duration(capacity(date).free)}. Limite de 80% para atividades variáveis: ${duration(capacity(date).limit)}; agendado: ${duration(capacity(date).booked)}. A reserva de 20% já está incluída neste limite, sem desconto duplo. Conflitos de horário específico ainda exigem conferência manual.</p></div>`}
if(view==='activities'){html=`<div class="stats"><div class="panel stat"><span class="muted">Total</span><strong>${state.activities.length}</strong></div><div class="panel stat"><span class="muted">Fixas</span><strong>${fixed}</strong></div><div class="panel stat"><span class="muted">Variáveis</span><strong>${variable}</strong></div></div><section class="panel"><div class="filters"><select id="catFilter" aria-label="Filtrar categoria"><option value="">Todas as categorias</option>${['Espiritualidade','Saúde','Família','Trabalho','Amigos'].map(c=>`<option>${c}</option>`).join('')}</select><select id="typeFilter" aria-label="Filtrar tipo"><option value="">Todos os tipos</option><option>Fixa</option><option>Variável</option></select></div><div id="activityList"></div></section>`}
if(view==='week'){
 const start=new Date(date+'T12:00:00');start.setDate(start.getDate()-start.getDay());
 const weekStart=localISO(start),weekEnd=shift(weekStart,6);
 html=`<section class="panel"><div class="row" style="flex-wrap:wrap"><div><strong>Semana de ${weekStart.split('-').reverse().join('/')} a ${weekEnd.split('-').reverse().join('/')}</strong><div class="muted" style="font-size:13px;margin-top:5px">Consulte qualquer semana, inclusive datas futuras.</div></div><div class="actions"><button type="button" class="btn tiny secondary" id="prevWeek">← Semana anterior</button><button type="button" class="btn tiny secondary" id="nextWeek">Próxima semana →</button></div></div><div class="filters" style="margin-top:14px;margin-bottom:0"><label for="weekPicker">Ir para uma data</label><input type="date" id="weekPicker" value="${date}"><button type="button" class="btn tiny secondary" id="currentWeek">Semana atual</button></div></section>`;
 html+=`<section class="panel"><h2>Pesquisar atividades por período e tema</h2><div class="search-grid"><label>Data inicial<input type="date" id="rangeStart" value="${rangeStart}"></label><label>Data final<input type="date" id="rangeEnd" value="${rangeEnd}"></label><label>Atividade ou categoria<input id="searchTerm" type="search" value="${esc(searchTerm)}" placeholder="Ex.: Doar sangue, Família"></label></div><div class="actions" style="margin-top:14px"><button class="btn" type="button" id="runSearch">Pesquisar</button><button class="btn secondary" type="button" id="clearSearch">Limpar tema</button></div><div id="searchResults" class="search-results" aria-live="polite"></div></section>`;
 html+='<div class="panel notice">Atividades variáveis aparecem após sua aprovação em Pendências. Reagendamentos exigem confirmação. Confira manualmente os horários das atividades sem horário definido.</div>';
 for(let d=0;d<7;d++){
  const ds=shift(weekStart,d),items=fixedOn(ds),variable=bookedOn(ds);
  html+=`<section class="panel"><h2>${DAYS[d]} · ${ds.split('-').reverse().join('/')}</h2>${items.length||variable.length?items.map(a=>`<div class="item"><div>${esc(a.name)}</div><span class="muted">${a.time||'Sem horário'} · ${duration(a.duration)}</span></div>`).join('')+variable.map(b=>{const a=state.activities.find(x=>x.id===b.activityId);return a?`<div class="item"><div>${esc(a.name)} <span class="tag">Variável aprovada</span><div class="muted">${duration(b.duration)}</div></div><button type="button" class="btn tiny secondary" data-reschedule="${esc(b.id)}">Reagendar</button></div>`:''}).join(''):'<span class="muted">Sem atividades</span>'}</section>`;
 }
}

 if(view==='pending'){const list=suggestions();html=`<section class="panel"><h2>Escolha as datas das atividades variáveis</h2><p class="muted">As sugestões são opcionais. Você sempre escolhe a data e confirma individualmente. Prioridade: Espiritualidade → Saúde → Família → Trabalho → Amigos. Capacidade máxima: 80% da disponibilidade diária, com reserva de 20% já incluída.</p>${list.map(({activity:a,date:d})=>`<div class="proposal"><strong>${esc(a.name)}</strong><div class="muted">${esc(a.category)} · ${duration(a.duration)} · ${esc(a.frequency)}${a.name==='Doar sangue'?' · Preferência: sábados':''}</div><div class="muted">${d?'Sugestão opcional: '+d.split('-').reverse().join('/'):'Sem sugestão nos próximos 28 dias; você pode escolher outra data.'}</div><label for="pick-${esc(a.id)}">Data escolhida por você</label> <input type="date" id="pick-${esc(a.id)}" data-pick="${esc(a.id)}" value="${d||'2026-11-01'}" min="2026-11-01"><div class="muted" data-feedback="${esc(a.id)}">Selecione a data para conferir a capacidade.</div><button class="btn tiny" data-manual="${esc(a.id)}">Confirmar agendamento</button></div>`).join('')}</section><section class="panel"><h2>Agendamentos aprovados</h2>${state.scheduled.length?state.scheduled.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(b=>{const a=state.activities.find(x=>x.id===b.activityId);return a?`<div class="item"><div><strong>${esc(a.name)}</strong><div class="muted">${b.date.split('-').reverse().join('/')} · ${duration(b.duration)}</div></div><button class="btn tiny secondary" data-unbook="${esc(b.id)}">Cancelar</button></div>`:''}).join(''):'<p class="muted">Nenhum agendamento aprovado.</p>'}</section>`}
if(view==='settings'){const missing=state.activities.filter(a=>a.type==='Fixa'&&!a.time);html=`<section class="panel"><h2>Validação e ativação</h2><p>Atividades cadastradas: <strong>${state.activities.length}</strong> · Fixas sem horário: <strong>${missing.length}</strong></p><p class="muted">Ativação planejada a partir de 01/11/2026. Os horários não definidos devem ser conferidos. A aprovação abaixo habilita apenas o registro de conclusão nesta versão, não valida o planejamento inteligente ainda não implementado.</p><label style="display:flex;gap:10px;align-items:center;margin-bottom:15px"><input type="checkbox" id="approval" ${state.activated?'checked':''}> Autorizo ativar o registro de execução das atividades neste dispositivo.</label><button class="btn" id="activate">${state.activated?'Salvar preferência':'Confirmar ativação do registro'}</button></section><section class="panel"><h2>Seus dados</h2><p class="muted">Exportação de segurança em JSON para recuperar os registros deste dispositivo. Não substitui o backup diário automático planejado.</p><div class="actions"><button class="btn secondary" id="export">Exportar dados JSON</button><label class="btn secondary" style="cursor:pointer">Importar JSON<input type="file" id="import" accept="application/json,.json" hidden></label></div></section>`}
$('content').innerHTML=html;if(view==='week'){$('prevWeek').onclick=()=>{date=shift(date,-7);render()};$('nextWeek').onclick=()=>{date=shift(date,7);render()};$('weekPicker').onchange=e=>{if(e.target.value){date=e.target.value;render()}};$('currentWeek').onclick=()=>{date=localISO(new Date());render()}};if(view==='today')$('dayPicker').onchange=e=>{date=e.target.value;render()};if(view==='week'){bindWeekSearch();bindReschedule()};if(view==='activities'){const update=()=>{const c=$('catFilter').value,t=$('typeFilter').value;const arr=state.activities.filter(a=>(!c||a.category===c)&&(!t||a.type===t));$('activityList').innerHTML=arr.map(a=>card(a,{showFrequency:true})).join('')||'<div class="empty">Nenhuma atividade encontrada.</div>';bindCards()};$('catFilter').onchange=update;$('typeFilter').onchange=update;update()}else bindCards();if(view==='pending')bindScheduling();if(view==='settings')bindSettings()}

function matchingActivities(from,to,term){
 const result=[],needle=term.trim().toLocaleLowerCase('pt-BR');
 for(let ds=from;ds<=to;ds=shift(ds,1)){
  const fixed=fixedOn(ds).map(a=>({activity:a,ds,booking:null}));
  const variable=bookedOn(ds).map(b=>({activity:state.activities.find(a=>a.id===b.activityId),ds,booking:b})).filter(x=>x.activity);
  for(const entry of [...fixed,...variable]){
   const a=entry.activity;
   if(!needle||[a.name,a.category,a.notes||''].some(x=>x.toLocaleLowerCase('pt-BR').includes(needle)))result.push(entry);
  }
 }
 return result;
}
function bindWeekSearch(){
 const show=()=>{
  const from=$('rangeStart').value,to=$('rangeEnd').value,term=$('searchTerm').value,out=$('searchResults');
  if(!from||!to||from>to){out.innerHTML='<p class="muted">Informe um período válido: a data inicial deve ser anterior ou igual à final.</p>';return}
  const days=Math.round((new Date(to+'T12:00:00')-new Date(from+'T12:00:00'))/86400000)+1;
  if(days>366){out.innerHTML='<p class="muted">Pesquise até 366 dias por vez para manter a consulta rápida.</p>';return}
  rangeStart=from;rangeEnd=to;searchTerm=term;
  const results=matchingActivities(from,to,term);
  out.innerHTML=`<p class="muted">${results.length} ocorrência(s) encontrada(s) entre ${from.split('-').reverse().join('/')} e ${to.split('-').reverse().join('/')}.</p>`+(results.length?results.map(({activity:a,ds,booking:b})=>`<div class="item"><div><strong>${esc(a.name)}</strong><div class="search-result-date">${DAYS[weekday(ds)]} · ${ds.split('-').reverse().join('/')} · ${esc(a.category)} · ${b?'Variável agendada':'Fixa recorrente'} · ${duration(b?b.duration:a.duration)}</div></div><div class="actions"><button type="button" class="btn tiny secondary" data-goto="${ds}">Ver semana</button>${b?`<button type="button" class="btn tiny" data-reschedule="${esc(b.id)}">Reagendar</button>`:''}</div></div>`).join(''):'<p class="muted">Nenhuma atividade encontrada neste período.</p>');
  out.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{date=b.dataset.goto;render()});bindReschedule();
 };
 $('runSearch').onclick=show;
 $('clearSearch').onclick=()=>{$('searchTerm').value='';show()};
 $('searchTerm').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();show()}};
 show();
}
function bindReschedule(){
 document.querySelectorAll('[data-reschedule]').forEach(btn=>btn.onclick=()=>{
  const booking=state.scheduled.find(x=>x.id===btn.dataset.reschedule);
  if(!booking){alert('Agendamento não encontrado. Atualize a página.');return}
  const activity=state.activities.find(a=>a.id===booking.activityId);
  if(!activity){alert('Atividade não encontrada.');return}
  const answer=prompt(`Reagendar ${activity.name}\nData atual: ${booking.date.split('-').reverse().join('/')}\nInforme a nova data no formato AAAA-MM-DD:`,booking.date);
  if(answer===null)return;
  const ds=answer.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)||Number.isNaN(new Date(ds+'T12:00:00').getTime())||localISO(new Date(ds+'T12:00:00'))!==ds){alert('Data inválida. Use AAAA-MM-DD, por exemplo 2027-01-09.');return}
  if(ds===booking.date){alert('A data informada é a mesma do agendamento atual.');return}
  if(ds<(state.start||'2026-11-01')){alert('A nova data não pode ser anterior ao início da rotina.');return}
  if(state.scheduled.some(x=>x.id!==booking.id&&x.activityId===booking.activityId&&x.date===ds)){alert('Esta atividade já está agendada na nova data.');return}
  const c=capacity(ds);
  if(c.booked+Number(booking.duration)>c.limit){alert(`Capacidade insuficiente em ${ds.split('-').reverse().join('/')}. Limite: ${duration(c.limit)}; já reservado: ${duration(c.booked)}. Escolha outra data.`);return}
  if(activity.name==='Doar sangue'&&weekday(ds)!==6&&!confirm('A preferência para doar sangue é sábado. Deseja usar outro dia?'))return;
  const wasDone=!!state.done[booking.date+'|'+activity.id];
  if(wasDone){alert('Esta atividade está marcada como concluída. Desfaça a conclusão antes de reagendar.');return}
  if(!confirm(`Confirmar reagendamento de ${activity.name}?\nDe: ${booking.date.split('-').reverse().join('/')}\nPara: ${ds.split('-').reverse().join('/')}\nO agendamento anterior será substituído.`))return;
  booking.date=ds;save();date=ds;render();alert('Reagendamento confirmado e salvo.');
 });
}
function bindCards(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const k=date+'|'+b.dataset.done;if(state.done[k])delete state.done[k];else state.done[k]=true;save();render()});document.querySelectorAll('[data-unbook]').forEach(b=>b.onclick=()=>{if(!confirm('Cancelar agendamento?'))return;state.scheduled=state.scheduled.filter(x=>x.id!==b.dataset.unbook);save();render()})}
 function bindScheduling(){
 const feedback=(id)=>{const a=state.activities.find(x=>x.id===id),el=document.querySelector(`[data-pick="${id}"]`),out=document.querySelector(`[data-feedback="${id}"]`);if(!a||!el||!out)return;const ds=el.value;if(!ds){out.textContent='Escolha uma data.';return}const c=capacity(ds),remaining=c.limit-c.booked,weekday=new Date(ds+'T12:00:00').getDay();const notes=[];notes.push(`Limite diário: ${duration(c.limit)}; já agendado: ${duration(c.booked)}; disponível para variáveis: ${duration(Math.max(0,remaining))}.`);if(a.duration>remaining)notes.push('Capacidade excedida: escolha outra data.');if(a.name==='Doar sangue'&&weekday!==6)notes.push('Atenção: preferência cadastrada para sábados.');if(state.scheduled.some(x=>x.activityId===id&&x.date===ds))notes.push('Esta atividade já está agendada nesta data.');out.textContent=notes.join(' ')};
 document.querySelectorAll('[data-pick]').forEach(el=>{el.onchange=()=>feedback(el.dataset.pick);feedback(el.dataset.pick)});
 document.querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>{const id=b.dataset.manual,a=state.activities.find(x=>x.id===id),ds=document.querySelector(`[data-pick="${id}"]`)?.value;if(!a||!ds)return;if(ds<'2026-11-01'){alert('A rotina começa em 01/11/2026.');return}if(state.scheduled.some(x=>x.activityId===id&&x.date===ds)){alert('Esta atividade já está agendada nesta data.');return}const c=capacity(ds);if(c.booked+Number(a.duration)>c.limit){alert('Esta data ultrapassa o limite de 80% da capacidade diária. Escolha outra data.');return}if(a.name==='Doar sangue'&&new Date(ds+'T12:00:00').getDay()!==6&&!confirm('A preferência para doar sangue é sábado. Deseja manter esta outra data?'))return;if(!confirm(`Confirmar ${a.name} em ${ds.split('-').reverse().join('/')}?`))return;state.scheduled.push({id:'booking-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),activityId:a.id,date:ds,duration:a.duration});save();render()});
 document.querySelectorAll('[data-unbook]').forEach(b=>b.onclick=()=>{if(!confirm('Cancelar este agendamento? O cadastro da atividade será preservado.'))return;state.scheduled=state.scheduled.filter(x=>x.id!==b.dataset.unbook);save();render()})}
function bindSettings(){$('activate').onclick=()=>{if(!state.activated&&!$('approval').checked){alert('Marque a autorização antes de ativar.');return}state.activated=$('approval').checked;save();render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='minha-rotina-backup-'+date+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.activities)||typeof x.done!=='object')throw Error('Formato inválido');if(!confirm('Substituir todos os dados locais deste dispositivo pelo arquivo selecionado? Faça uma exportação antes de continuar.'))return;state=x;state.scheduled=Array.isArray(state.scheduled)?state.scheduled:[];save();render();alert('Dados importados.')}catch(err){alert('Não foi possível importar: '+err.message)}}}
function openForm(id){editing=id||null;const a=state.activities.find(x=>x.id===id)||{name:'',category:'Família',type:'Variável',duration:30,time:'',frequency:'Semanal',days:[],start:'2026-11-01',notes:''};$('formTitle').textContent=id?'Editar atividade':'Nova atividade';for(const [field,key] of [['fName','name'],['fCategory','category'],['fType','type'],['fDuration','duration'],['fTime','time'],['fFrequency','frequency'],['fStart','start'],['fNotes','notes']])$(field).value=a[key]??'';$('daychecks').innerHTML=DAYS.map((d,i)=>`<label><input type="checkbox" value="${i}" ${a.days.includes(i)?'checked':''}>${d}</label>`).join('');$('dialog').showModal()}
$('newBtn').onclick=()=>openForm();$('cancelForm').onclick=()=>$('dialog').close();$('activityForm').onsubmit=e=>{e.preventDefault();const a={id:editing||'user-'+Date.now(),name:$('fName').value.trim(),category:$('fCategory').value,type:$('fType').value,duration:Number($('fDuration').value),time:$('fTime').value,frequency:$('fFrequency').value,start:$('fStart').value||'2026-11-01',days:[...$('daychecks').querySelectorAll('input:checked')].map(x=>Number(x.value)),notes:$('fNotes').value,validated:false};if(!a.name||a.duration<1)return;if(editing){const i=state.activities.findIndex(x=>x.id===editing);if(i>=0)state.activities[i]=a}else state.activities.push(a);save();$('dialog').close();render()};save();render();
</script></body></html>
